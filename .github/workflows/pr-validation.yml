name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validar projeto
        run: mvn --batch-mode clean verify